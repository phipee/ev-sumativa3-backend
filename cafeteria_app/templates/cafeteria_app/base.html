<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cafetería Fiores{% endblock %}</title>
</head>
<body>
    <header>
        <h1><a href="{% url 'cafeteria_app:inicio' %}">Cafetería Fiores</a></h1>
        <nav aria-label="Navegación principal">
            <a href="{% url 'cafeteria_app:inicio' %}">Inicio</a>
            <a href="{% url 'cafeteria_app:lista_productos' %}">Productos</a>
            {% if user.is_authenticated %}
                <a href="{% url 'cafeteria_app:lista_pedidos' %}">Mis pedidos</a>
            {% else %}
                <a href="{% url 'cafeteria_app:login' %}">Ingresar</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
